<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filter for subtle crisp phone shadow -->
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Phone Group -->
  <g filter="url(#phoneShadow)">
    <!-- Side Buttons -->
    <!-- Volume Up -->
    <rect x="136" y="160" width="10" height="42" rx="5" fill="#059669"/>
    <!-- Volume Down -->
    <rect x="136" y="216" width="10" height="42" rx="5" fill="#059669"/>
    <!-- Power Button -->
    <rect x="366" y="180" width="10" height="52" rx="5" fill="#059669"/>

    <!-- Smartphone Body Chassis -->
    <rect x="144" y="76" width="224" height="360" rx="44" fill="#FFFFFF" stroke="url(#phoneBorder)" stroke-width="14"/>

    <!-- Screen Area -->
    <rect x="166" y="136" width="180" height="236" rx="22" fill="url(#screenGrad)" stroke="#A7F3D0" stroke-width="4"/>

    <!-- Top Speaker Slit -->
    <rect x="226" y="100" width="60" height="8" rx="4" fill="#059669"/>

    <!-- Front Camera Lens -->
    <circle cx="256" cy="120" r="6" fill="#047857"/>
    <circle cx="258" cy="118" r="2" fill="#34D399"/>

    <!-- Diagnostic Health Waveform (Green Pulse) -->
    <path d="M 180 254 L 210 254 L 226 210 L 246 298 L 266 226 L 282 270 L 296 254 L 332 254"
          fill="none"
          stroke="url(#pulseGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Diagnostic Circular Glow Node -->
    <circle cx="246" cy="298" r="7" fill="#10B981"/>

    <!-- Bottom Home Indicator Bar -->
    <rect x="216" y="406" width="80" height="8" rx="4" fill="#059669"/>
  </g>
</svg>
