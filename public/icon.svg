<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Shield Base -->
  <path d="M256 80 L390 136 C390 270 332 376 256 424 C180 376 122 270 122 136 Z" 
        fill="url(#shieldGrad)" stroke="#10b981" stroke-width="8" stroke-linejoin="round"/>

  <!-- Android Droid Antennae -->
  <line x1="206" y1="172" x2="182" y2="136" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <line x1="306" y1="172" x2="330" y2="136" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>

  <!-- Droid Head Dome -->
  <path d="M186 216 C186 177 217 146 256 146 C295 146 326 177 326 216 Z" fill="url(#accentGrad)"/>
  <!-- Droid Eyes -->
  <circle cx="224" cy="188" r="6" fill="#090d16"/>
  <circle cx="288" cy="188" r="6" fill="#090d16"/>

  <!-- Pulse / Health Waveform inside Shield -->
  <path d="M166 288 L214 288 L234 244 L256 332 L278 266 L298 288 L346 288" 
        fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CPU / Chip Contact Nodes -->
  <rect x="246" y="360" width="20" height="20" rx="4" fill="#10b981"/>
  <circle cx="216" cy="370" r="4" fill="#38bdf8"/>
  <circle cx="296" cy="370" r="4" fill="#38bdf8"/>
</svg>
